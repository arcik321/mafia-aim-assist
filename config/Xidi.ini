[Mapper]
Type = MafiaGamepad

[CustomMapper:MafiaGamepad]
Template = StandardGamepad

; The right stick is handled by MafiaAimLogic.dll as mouse movement, so Xidi must not also report it.
; To let the game read the right stick itself instead, delete these two lines and set
; right_stick_look = 0 in MafiaAimAssist.ini.
StickRightX = Null
StickRightY = Null

[Properties]
MouseSpeedScalingFactorPercent = 100
