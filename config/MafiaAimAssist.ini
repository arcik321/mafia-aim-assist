[aim]
; Hold the left trigger (or the O key) to lock onto the nearest person in front of you.

; Height of the aim point above the target's feet, in centimetres.
; The default hits the torso of a standing person and the chest/head of a crouching one.
; Raise it (for example 120) if you prefer aiming at the head of standing targets.
aim_height_cm = 95

; Lower this to make lock-on approach the target more slowly (range 25..150).
aim_response_percent = 70

; Right stick moves the camera like a mouse (1 = on, 0 = off).
right_stick_look = 1

; Camera speed at full stick deflection (mouse counts per second). Raise to turn faster.
look_x_speed = 1100
look_y_speed = 1000

; Set to 1 if looking up/down feels inverted.
invert_y = 0

; Ignore small stick drift (percent of stick travel).
stick_deadzone = 15
